<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>자주 묻는 질문 - 이모팁스</title>
<meta property="og:title" content="자주 묻는 질문 - 이모팁스">
<meta property="og:description" content="노션에 정리한 자주 묻는 질문 모음">
<meta property="og:type" content="website">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
    background: #f7f8f9;
    color: #231815;
    min-height: 100vh;
    line-height: 1.65;
  }

  .topbar {
    position: sticky;
    top: 0;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 14px 20px;
    background: rgba(247,248,249,0.92);
    border-bottom: 1px solid rgba(35,24,21,0.08);
    backdrop-filter: blur(12px);
  }

  .home-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    color: #231815;
    text-decoration: none;
    font-size: 13px;
    font-weight: 900;
    white-space: nowrap;
  }

  .top-title {
    font-size: 13px;
    font-weight: 900;
    color: rgba(35,24,21,0.55);
  }

  main {
    width: min(920px, calc(100% - 36px));
    margin: 0 auto;
    padding: 42px 0 72px;
  }

  .hero {
    margin-bottom: 28px;
  }

  .eyebrow {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    margin-bottom: 10px;
    color: #f2517a;
    font-size: 13px;
    font-weight: 900;
  }

  h1 {
    font-size: clamp(32px, 7vw, 56px);
    line-height: 1.05;
    letter-spacing: -0.02em;
    margin-bottom: 14px;
  }

  .intro {
    max-width: 640px;
    color: rgba(35,24,21,0.68);
    font-size: 16px;
    font-weight: 700;
    word-break: keep-all;
  }

  .meta {
    margin-top: 14px;
    color: rgba(35,24,21,0.42);
    font-size: 12px;
    font-weight: 800;
  }

  .tips-list {
    display: grid;
    gap: 16px;
  }

  .tip-card {
    padding: 26px;
    border-radius: 18px;
    background: #fff;
    border: 1px solid rgba(35,24,21,0.08);
    box-shadow: 0 16px 38px rgba(35,24,21,0.055);
  }

  .tip-title {
    margin-bottom: 12px;
    font-size: 21px;
    line-height: 1.35;
    letter-spacing: -0.01em;
    font-weight: 900;
    word-break: keep-all;
  }

  .tip-content {
    display: grid;
    gap: 10px;
    color: rgba(35,24,21,0.78);
    font-size: 15px;
    font-weight: 650;
    word-break: keep-all;
  }

  .tip-content p {
    white-space: pre-wrap;
  }

  .empty {
    padding: 34px 24px;
    border-radius: 18px;
    background: #fff;
    border: 1px dashed rgba(35,24,21,0.18);
    color: rgba(35,24,21,0.58);
    font-size: 14px;
    font-weight: 800;
    text-align: center;
  }

  @media (max-width: 560px) {
    .topbar {
      padding: 12px 16px;
    }

    .top-title {
      display: none;
    }

    main {
      width: min(100% - 28px, 920px);
      padding: 32px 0 56px;
    }

    .intro {
      font-size: 14px;
    }

    .tip-card {
      padding: 22px 18px;
      border-radius: 16px;
    }

    .tip-title {
      font-size: 18px;
    }

    .tip-content {
      font-size: 14px;
    }
  }
</style>
</head>
<body>
  <nav class="topbar" aria-label="페이지 이동">
    <a class="home-link" href="index.html">← 메인으로</a>
    <div class="top-title">이모팁스</div>
  </nav>

  <main>
    <section class="hero">
      <div class="eyebrow">💡 Notion FAQ</div>
      <h1>자주 묻는 질문</h1>
      <p class="intro">노션에 적어둔 자주 묻는 질문을 단순한 텍스트로 모아두는 공간이에요. 노션 글을 수정하면 예약 동기화로 사이트에 자동 반영됩니다.</p>
      <div class="meta" id="updatedMeta" hidden></div>
    </section>

    <section class="tips-list" id="tipsList" aria-live="polite">
      <div class="empty">질문 리스트를 불러오는 중이에요.</div>
    </section>
  </main>

<script>
  const tipsList = document.getElementById('tipsList');
  const updatedMeta = document.getElementById('updatedMeta');

  function escapeHTML(value) {
    return String(value ?? '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#039;');
  }

  function formatDate(value) {
    if (!value) return '';
    const date = new Date(value);
    if (Number.isNaN(date.getTime())) return '';
    return new Intl.DateTimeFormat('ko-KR', {
      year: 'numeric',
      month: 'long',
      day: 'numeric',
      hour: '2-digit',
      minute: '2-digit'
    }).format(date);
  }

  function renderContent(content) {
    const paragraphs = String(content || '')
      .split(/\n{2,}/)
      .map((part) => part.trim())
      .filter(Boolean);

    if (!paragraphs.length) return '<p>내용이 아직 비어 있어요.</p>';
    return paragraphs.map((part) => `<p>${escapeHTML(part)}</p>`).join('');
  }

  function renderTips(data) {
    const tips = Array.isArray(data.tips) ? data.tips : [];
    const updated = formatDate(data.updatedAt);

    if (updated) {
      updatedMeta.hidden = false;
      updatedMeta.textContent = `마지막 동기화: ${updated}`;
    }

    if (!tips.length) {
      tipsList.innerHTML = '<div class="empty">아직 등록된 질문이 없어요.</div>';
      return;
    }

    tipsList.innerHTML = tips.map((tip) => {
      const title = escapeHTML(tip.title || '제목 없는 질문');
      const content = renderContent(tip.content || '');

      return `
        <article class="tip-card">
          <h2 class="tip-title">${title}</h2>
          <div class="tip-content">${content}</div>
        </article>
      `;
    }).join('');
  }

  async function loadTips() {
    try {
      const response = await fetch(`assets/tips.json?v=${Date.now()}`);
      if (!response.ok) throw new Error('tips.json load failed');
      renderTips(await response.json());
    } catch (error) {
      tipsList.innerHTML = '<div class="empty">질문 리스트를 불러오지 못했어요. 잠시 후 다시 확인해주세요.</div>';
    }
  }

  loadTips();
</script>
</body>
</html>
